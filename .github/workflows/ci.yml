name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,io,data]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (mypy)
        run: mypy src/cvlab

      - name: Unit tests + coverage
        run: pytest -q --cov=cvlab --cov-report=xml --cov-report=term

      - name: Regenerate all figures (synthetic data)
        run: cvlab all --prefer synthetic --dpi 90

      - name: Upload figures
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: output-images
          path: |
            output_images/
            results/
          if-no-files-found: error

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
